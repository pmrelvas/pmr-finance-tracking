<div class="categories-page">
  <div class="categories-header">
    <h1>Categories</h1>
    <p-button label="Add Category" icon="pi pi-plus" (onClick)="openCreateDialog()" />
  </div>

  <p-table
    [value]="categories()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 25, 50]"
    [globalFilterFields]="['code', 'displayName']"
    dataKey="id"
    styleClass="p-datatable-striped"
    #dt
  >
    <ng-template #caption>
      <div class="table-caption">
        <input
          pInputText
          type="text"
          placeholder="Search categories..."
          (input)="dt.filterGlobal($any($event.target).value, 'contains')"
        />
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th pSortableColumn="code">
          Code <p-sortIcon field="code" />
        </th>
        <th pSortableColumn="displayName">
          Display Name <p-sortIcon field="displayName" />
        </th>
        <th>Sub-categories</th>
        <th pSortableColumn="createdAt">
          Created At <p-sortIcon field="createdAt" />
        </th>
        <th></th>
      </tr>
    </ng-template>

    <ng-template #body let-category>
      <tr>
        <td>
          <p-tag [value]="category.code" severity="secondary" />
        </td>
        <td>{{ category.displayName }}</td>
        <td>{{ category.subCategories.length }}</td>
        <td>{{ category.createdAt | date: dateFormats.timestamp }}</td>
        <td class="actions-cell">
          <p-button
            icon="pi pi-list"
            [rounded]="true"
            [text]="true"
            severity="secondary"
            pTooltip="View sub-categories"
            tooltipPosition="top"
            (onClick)="navigateToSubCategories(category)"
          />
          <p-button
            icon="pi pi-pencil"
            [rounded]="true"
            [text]="true"
            severity="secondary"
            (onClick)="openEditDialog(category)"
          />
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="5" class="empty-message">No categories found.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<pmr-category-write-dialog
  [(visible)]="dialogVisible"
  [category]="selectedCategory()"
  (categorySaved)="onCategorySaved($event)"
/>
